# Base de datos de desarrollo local. Credenciales triviales a propósito:
# el puerto solo escucha en 127.0.0.1 y aquí nunca van datos de producción.
#
# Puerto 5434 en el host: 5432 y 5433 ya los ocupan otros proyectos locales.
# La imagen solo publica amd64, así que en Apple Silicon corre emulada.
services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    container_name: rails-tracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rails_tracker
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - rails-tracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rails_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  rails-tracker-pgdata:
